name: deploy

on:
  push:
    branches: [main]
  # Rebuild daily so the download page and version badge pick up new linscp releases.
  schedule:
    - cron: '17 5 * * *'
  # linscp's release workflow can trigger a rebuild right away:
  #   gh api repos/99ecarvalho/linscp-website/dispatches -f event_type=linscp-release
  repository_dispatch:
    types: [linscp-release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
